name: Skyline Visuals

# github/gh-skyline CLI builds a real 3D-printable .stl per year from the
# contributions GraphQL API, committed to the metrics-output branch and
# viewable in GitHub's native 3D viewer.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  setup-years:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.compute.outputs.years }}
    env:
      START_YEAR: "2024"
    steps:
      - id: compute
        run: |
          current=$(date +%Y)
          years=$(python3 -c "import json; print(json.dumps([str(y) for y in range(${START_YEAR}, ${current}+1)]))")
          echo "Years to render: $years"
          echo "years=$years" >> "$GITHUB_OUTPUT"

  # Pre-create the metrics-output branch so the skyline job can commit
  # against it even on a fresh repository.
  setup-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure metrics-output branch exists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin metrics-output; then
            echo "metrics-output already exists"
          else
            git checkout --orphan metrics-output
            git rm -rf . > /dev/null 2>&1 || true
            echo "# metrics-output" > README.md
            git add README.md
            git commit -m "chore: initialize metrics-output branch"
            git push origin metrics-output
          fi

  stl-skylines:
    needs: [setup-years, setup-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.setup-years.outputs.years) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metrics-output
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gh-skyline extension
        run: gh extension install github/gh-skyline

      - name: Generate STL for ${{ matrix.year }}
        run: gh skyline --user ${{ github.repository_owner }} --year ${{ matrix.year }} --output skyline-${{ matrix.year }}.stl

      - name: Commit STL if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyline-${{ matrix.year }}.stl
          if git diff --cached --quiet; then
            echo "no STL changes for ${{ matrix.year }}"
          else
            git commit -m "Update STL skyline ${{ matrix.year }}"
            git pull --rebase origin metrics-output
            git push
          fi
